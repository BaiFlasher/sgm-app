<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SGM PRO - Solusi Gadget Martin</title>
    
    <!-- Library Essentials -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase Compat SDK (Stable for Single HTML) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .bottom-nav-shadow { box-shadow: 0 -4px 20px rgba(0,0,0,0.05); }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        .animate-slide-up { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @media print { .no-print { display: none !important; } }
        input, select, textarea { font-size: 16px !important; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // --- KONFIGURASI FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyAnaxWWQRgCJ2BT2LY8quibHBPzgoUS1kE",
            authDomain: "gsm-app-afe20.firebaseapp.com",
            projectId: "gsm-app-afe20",
            storageBucket: "gsm-app-afe20.firebasestorage.app",
            messagingSenderId: "721664568589",
            appId: "1:721664568589:web:508d22c640dcea38135444"
        };

        // Inisialisasi Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();
        const appId = "SGM-FINAL-V32";

        const { useState, useEffect, useRef } = React;

        const statusColor = {
            "Masuk": "bg-gray-200 text-gray-700",
            "Bongkar": "bg-yellow-100 text-yellow-700",
            "Menunggu Sparepart": "bg-orange-100 text-orange-700",
            "Proses": "bg-blue-100 text-blue-700",
            "Selesai": "bg-green-100 text-green-700",
            "Sudah Diambil": "bg-teal-100 text-teal-700",
        };

        function App() {
            // -- AUTH & ROLE --
            const [user, setUser] = useState(null);
            const [role, setRole] = useState(null); 
            const [activeTab, setActiveTab] = useState("Dashboard");
            const [loading, setLoading] = useState(true);
            const [showPin, setShowPin] = useState(false);
            const [pinInput, setPinInput] = useState("");
            const [dbOnline, setDbOnline] = useState(false);
            const [dbMissing, setDbMissing] = useState(false);

            // -- DATA STATES (Offline First via LocalStorage) --
            const [services, setServices] = useState(() => JSON.parse(localStorage.getItem('sgm_srv') || '[]'));
            const [stok, setStok] = useState(() => JSON.parse(localStorage.getItem('sgm_stk') || '[]'));
            const [teknisi, setTeknisi] = useState([{id: '1', nama: 'Martin', pin: '1234'}]);
            const [absensi, setAbsensi] = useState([]);

            // -- UI FORMS --
            const [isFormOpen, setIsFormOpen] = useState(false);
            const [formData, setFormData] = useState({ name: "", phone: "", hp: "", keluhan: "", harga: "", status: "Masuk" });

            // -- INITIAL AUTH --
            useEffect(() => {
                auth.signInAnonymously().catch(e => console.log("Auth Offline Mode"));
                const unsubscribe = auth.onAuthStateChanged(u => {
                    setUser(u);
                    // Paksa matikan loading setelah 3 detik jika tidak ada respon dari Cloud
                    setTimeout(() => setLoading(false), 3000);
                });
                return () => unsubscribe();
            }, []);

            // -- REALTIME CLOUD SYNC --
            useEffect(() => {
                if (!user) return;
                
                const collections = ['services', 'stok', 'teknisi', 'absensi'];
                const unsubscribers = collections.map(col => {
                    return db.collection('artifacts').doc(appId).collection('public').doc('data').collection(col)
                        .onSnapshot(s => {
                            const data = s.docs.map(d => ({id: d.id, ...d.data()}));
                            if (data.length > 0) {
                                if (col === 'services') { setServices(data); localStorage.setItem('sgm_srv', JSON.stringify(data)); }
                                if (col === 'stok') { setStok(data); localStorage.setItem('sgm_stk', JSON.stringify(data)); }
                                if (col === 'teknisi') setTeknisi(data);
                                if (col === 'absensi') setAbsensi(data);
                            }
                            setDbOnline(true);
                            setDbMissing(false);
                            setLoading(false);
                        }, (err) => {
                            console.log(`Firestore ${col} Error:`, err.message);
                            if (err.message.includes("does not exist") || err.code === "not-found") {
                                setDbMissing(true);
                            }
                            setDbOnline(false);
                            setLoading(false);
                        });
                });

                return () => unsubscribers.forEach(unsub => unsub());
            }, [user]);

            // -- UTILITIES --
            const formatRp = (n) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(n || 0);

            const handleLogin = () => {
                if (pinInput === "konter123") { setRole("admin"); setShowPin(false); setPinInput(""); }
                else if (pinInput === "1234") { setRole("teknisi"); setShowPin(false); setPinInput(""); }
                else { alert("PIN Salah!"); }
            };

            const submitNota = async (e) => {
                e.preventDefault();
                const id = `SGM-${Math.floor(1000 + Math.random() * 9000)}`;
                const newData = { 
                    ...formData, 
                    id, 
                    harga: Number(formData.harga), 
                    tglMasuk: new Date().toLocaleDateString('id-ID'), 
                    timestamp: Date.now() 
                };
                
                // Optimistic Update (Lokal dulu agar instan)
                const updated = [newData, ...services];
                setServices(updated);
                localStorage.setItem('sgm_srv', JSON.stringify(updated));
                
                // Kirim ke Cloud (jika online)
                try {
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('services').doc(id).set(newData);
                } catch (e) { console.log("Hanya tersimpan di HP (Offline/DB Belum Ada)"); }

                setIsFormOpen(false);
                setFormData({ name: "", phone: "", hp: "", keluhan: "", harga: "", status: "Masuk" });
            };

            const updateStatus = async (id, status) => {
                const updated = services.map(s => s.id === id ? { ...s, status } : s);
                setServices(updated);
                localStorage.setItem('sgm_srv', JSON.stringify(updated));
                
                try {
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('services').doc(id).update({ status });
                } catch (e) { console.log("Status diperbarui di HP saja"); }
            };

            // --- COMPONENTS ---
            const StatCard = ({ title, value, color = "text-gray-800" }) => (
                <div className="bg-white p-5 rounded-[30px] border border-gray-50 shadow-sm transition-transform active:scale-95">
                    <p className="text-[10px] font-bold text-gray-400 uppercase mb-1 tracking-widest leading-none">{title}</p>
                    <p className={`text-2xl font-black ${color} tracking-tighter`}>{value}</p>
                </div>
            );

            if (loading && !services.length) return (
                <div className="h-screen flex flex-col items-center justify-center bg-white p-10 text-center">
                    <div className="w-10 h-10 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-4"></div>
                    <p className="text-gray-400 font-bold text-[10px] tracking-widest uppercase">Menghubungkan SGM PRO...</p>
                    {dbMissing && (
                        <p className="mt-4 text-[9px] text-orange-500 font-medium">Database (default) belum dibuat di Firebase Console.</p>
                    )}
                </div>
            );

            // -- RENDER LOGIN --
            if (!role) return (
                <div className="min-h-screen bg-[#0f172a] flex flex-col items-center justify-center p-8 text-center">
                    <div className="w-20 h-20 bg-blue-600 rounded-[2.5rem] mb-6 flex items-center justify-center shadow-2xl shadow-blue-500/40">
                        <span className="text-4xl text-white font-black italic">S</span>
                    </div>
                    <h1 className="text-white text-3xl font-black tracking-tighter mb-1 uppercase">SGM PRO V3.3</h1>
                    <p className="text-blue-400 text-[10px] font-bold tracking-[0.4em] uppercase mb-12 leading-relaxed">Solusi Gadget Martin<br/>Master Edition</p>
                    
                    <div className="w-full max-w-xs space-y-4">
                        <button onClick={() => setRole("pelanggan")} className="w-full bg-blue-600 text-white font-bold py-5 rounded-3xl shadow-xl shadow-blue-600/20 active:scale-95 transition">PORTAL PELANGGAN</button>
                        <button onClick={() => setShowPin(true)} className="w-full bg-white/5 border border-white/10 text-white font-bold py-5 rounded-3xl active:bg-white/10 transition">DASHBOARD STAFF</button>
                    </div>

                    {dbMissing && (
                        <div className="mt-12 p-5 bg-orange-600/20 border border-orange-500/40 rounded-3xl max-w-xs animate-pulse">
                            <p className="text-orange-300 text-[10px] font-bold leading-relaxed uppercase mb-2">
                                ⚠️ DATABASE BELUM DIBUAT
                            </p>
                            <p className="text-white/60 text-[9px] leading-relaxed">
                                Silakan buka Firebase Console, pilih menu <b>Build > Firestore Database</b>, lalu klik <b>"Create Database"</b> untuk mengaktifkan sinkronisasi Cloud.
                            </p>
                        </div>
                    )}

                    {showPin && (
                        <div className="fixed inset-0 bg-black/95 backdrop-blur-md z-50 flex items-center justify-center p-8">
                            <div className="bg-white p-10 rounded-[3rem] w-full max-w-xs text-center shadow-2xl animate-slide-up">
                                <h2 className="font-black text-gray-800 text-xl mb-8 uppercase tracking-tight">PIN Otorisasi</h2>
                                <input type="password" placeholder="••••" className="w-full bg-gray-50 border-2 border-gray-100 p-5 rounded-3xl text-center text-4xl font-black tracking-[0.4em] mb-8 focus:border-blue-500 outline-none transition-all" value={pinInput} onChange={e => setPinInput(e.target.value)} autoFocus />
                                <button onClick={handleLogin} className="w-full bg-blue-600 text-white font-black py-5 rounded-3xl shadow-xl shadow-blue-500/30">MASUK SEKARANG</button>
                                <button onClick={() => {setShowPin(false); setPinInput("");}} className="mt-8 text-[10px] font-bold text-gray-400 uppercase tracking-widest">Tutup</button>
                            </div>
                        </div>
                    )}
                </div>
            );

            // -- MAIN APP RENDER --
            return (
                <div className="min-h-screen pb-32">
                    {/* Sticky Header */}
                    <header className="glass sticky top-0 z-40 px-6 py-5 flex justify-between items-center border-b border-gray-100">
                        <div>
                            <h2 className="font-black text-blue-600 tracking-tighter text-2xl italic leading-none">SGM PRO</h2>
                            <div className="flex items-center gap-1.5 mt-1.5">
                                <div className={`w-2 h-2 rounded-full ${dbOnline ? 'bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.6)]' : (dbMissing ? 'bg-orange-500' : 'bg-gray-300')}`}></div>
                                <p className="text-[9px] font-black text-gray-400 uppercase tracking-widest leading-none">
                                    {role} • {dbOnline ? 'Awan Aktif' : (dbMissing ? 'Butuh Setup' : 'Lokal')}
                                </p>
                            </div>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={() => setIsFormOpen(true)} className="bg-blue-600 text-white w-12 h-12 rounded-2xl flex items-center justify-center shadow-lg shadow-blue-500/30 font-bold text-2xl active:scale-90 transition">+</button>
                            <button onClick={() => setRole(null)} className="bg-gray-50 text-gray-300 w-12 h-12 rounded-2xl flex items-center justify-center font-bold active:bg-red-50 active:text-red-400 transition">✕</button>
                        </div>
                    </header>

                    <main className="p-6 max-w-xl mx-auto w-full">
                        {activeTab === "Dashboard" && (
                            <div className="space-y-6">
                                {/* Profit Card */}
                                <div className="bg-gradient-to-br from-blue-600 to-indigo-900 p-8 rounded-[40px] text-white shadow-2xl relative overflow-hidden animate-slide-up">
                                    <div className="relative z-10">
                                        <p className="text-[10px] font-bold opacity-60 uppercase tracking-[0.2em] mb-1.5">Total Omzet</p>
                                        <h3 className="text-4xl font-black tracking-tighter">
                                            {formatRp(services.filter(s => s.status === "Sudah Diambil" || s.status === "Selesai").reduce((a, b) => a + (b.harga || 0), 0))}
                                        </h3>
                                    </div>
                                    <div className="absolute -right-6 -bottom-6 text-[10rem] font-black opacity-10 italic pointer-events-none select-none">S</div>
                                </div>
                                
                                <div className="grid grid-cols-2 gap-4">
                                    <StatCard title="Antrean" value={services.filter(s => s.status === 'Masuk' || s.status === 'Proses').length} />
                                    <StatCard title="Siap Ambil" value={services.filter(s => s.status === 'Selesai').length} color="text-green-500" />
                                </div>

                                {/* Active List */}
                                <div className="space-y-4">
                                    <h4 className="font-black text-gray-800 tracking-tight flex justify-between items-center px-1">
                                        <span>LIST SERVIS AKTIF</span>
                                        <span className="text-[10px] text-blue-600 font-bold uppercase tracking-widest">{services.filter(s => s.status !== 'Sudah Diambil').length} UNIT</span>
                                    </h4>
                                    
                                    {services.filter(s => s.status !== "Sudah Diambil").length === 0 ? (
                                        <div className="text-center py-24 bg-white rounded-[40px] border-2 border-dashed border-gray-100">
                                            <p className="text-gray-300 text-xs font-bold italic uppercase tracking-widest">Tidak ada antrean</p>
                                        </div>
                                    ) : (
                                        services.filter(s => s.status !== "Sudah Diambil").sort((a,b) => b.timestamp - a.timestamp).map(s => (
                                            <div key={s.id} className="bg-white p-6 rounded-[35px] border border-gray-50 shadow-sm flex flex-col gap-4 animate-slide-up">
                                                <div className="flex justify-between items-start">
                                                    <div className="flex-1 mr-4 overflow-hidden">
                                                        <h5 className="font-black text-gray-800 text-base truncate uppercase tracking-tight leading-tight">{s.hp}</h5>
                                                        <p className="text-[10px] font-bold text-blue-500 uppercase mt-1 tracking-widest">{s.id} • {s.name}</p>
                                                    </div>
                                                    <div className={`text-[9px] font-black px-3 py-1.5 rounded-full uppercase tracking-wider shadow-sm ${statusColor[s.status]}`}>{s.status}</div>
                                                </div>
                                                <div className="text-xs text-gray-500 font-medium bg-gray-50 p-4 rounded-3xl italic border border-gray-100 leading-relaxed">
                                                    "{s.keluhan}"
                                                </div>
                                                <div className="flex justify-between items-center pt-1 px-1">
                                                    <div className="text-blue-800 font-black text-xl tracking-tighter">{formatRp(s.harga)}</div>
                                                    <div className="relative">
                                                        <select 
                                                            value={s.status} 
                                                            onChange={(e) => updateStatus(s.id, e.target.value)}
                                                            className="bg-gray-100 border-none text-[10px] font-black pl-4 pr-10 py-3 rounded-2xl focus:ring-2 focus:ring-blue-500 appearance-none shadow-inner"
                                                        >
                                                            <option value="Masuk">MASUK</option>
                                                            <option value="Proses">PROSES</option>
                                                            <option value="Selesai">SELESAI</option>
                                                            <option value="Sudah Diambil">DIAMBIL</option>
                                                        </select>
                                                        <div className="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-gray-400 text-[8px]">▼</div>
                                                    </div>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        )}

                        {activeTab === "Stok" && (
                            <div className="space-y-6 animate-slide-up">
                                <div className="flex justify-between items-center px-1">
                                    <h3 className="font-black text-2xl tracking-tighter uppercase">Gudang Part</h3>
                                    <button className="bg-gray-900 text-white text-[10px] px-5 py-3 rounded-2xl font-black uppercase tracking-widest shadow-lg shadow-gray-900/20 active:scale-90 transition">+ ITEM</button>
                                </div>
                                <div className="bg-white p-8 rounded-[40px] border border-gray-50 shadow-sm space-y-5">
                                    {stok.length === 0 ? (
                                        <div className="py-20 text-center">
                                            <p className="text-gray-200 text-[10px] font-black uppercase italic tracking-[0.3em] leading-loose">
                                                Stok Kosong
                                            </p>
                                        </div>
                                    ) : (
                                        stok.map(item => (
                                            <div key={item.id} className="flex justify-between items-center pb-5 border-b border-gray-50 last:border-0 last:pb-0">
                                                <div>
                                                    <p className="font-black text-gray-800 text-sm uppercase tracking-tight">{item.nama}</p>
                                                    <p className="text-[10px] text-gray-400 font-bold uppercase tracking-widest mt-0.5">{formatRp(item.harga)}</p>
                                                </div>
                                                <div className="bg-blue-50 text-blue-600 px-5 py-2.5 rounded-2xl font-black text-xs shadow-inner">
                                                    {item.qty} PCS
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        )}

                        {activeTab === "Absensi" && (
                            <div className="space-y-6 animate-slide-up">
                                <div className="bg-white p-10 rounded-[50px] border border-gray-50 shadow-sm text-center">
                                    <div className="w-24 h-24 bg-blue-50 rounded-[2.5rem] flex items-center justify-center mx-auto mb-6 shadow-inner">
                                        <span className="text-4xl">📸</span>
                                    </div>
                                    <h3 className="font-black text-2xl mb-2 uppercase tracking-tighter">Selfie Absen</h3>
                                    <p className="text-xs text-gray-400 mb-8 font-medium px-4">Lakukan absensi untuk memulai shift kerja.</p>
                                    <button className="w-full bg-blue-600 text-white font-black py-5 rounded-[2rem] shadow-xl shadow-blue-500/20 active:scale-95 transition">ABSEN SEKARANG</button>
                                </div>
                            </div>
                        )}

                        {activeTab === "Pengaturan" && (
                            <div className="space-y-6 animate-slide-up">
                                <h3 className="font-black text-2xl tracking-tighter uppercase px-2">Admin Panel</h3>
                                <div className="space-y-3">
                                    <div className="bg-white p-6 rounded-[30px] border flex items-center justify-between shadow-sm">
                                        <span className="text-sm font-bold text-gray-700">Database Status</span>
                                        <div className="flex items-center gap-2">
                                            <div className={`w-2 h-2 rounded-full ${dbOnline ? 'bg-green-500' : (dbMissing ? 'bg-orange-500' : 'bg-red-500')}`}></div>
                                            <span className={`text-[10px] font-black uppercase ${dbOnline ? 'text-green-600' : (dbMissing ? 'text-orange-600' : 'text-red-600')}`}>
                                                {dbOnline ? 'Terhubung Awan' : (dbMissing ? 'Firestore Belum Dibuat' : 'Offline')}
                                            </span>
                                        </div>
                                    </div>
                                    {dbMissing && (
                                        <div className="bg-orange-50 p-6 rounded-[30px] border border-orange-200">
                                            <p className="text-[10px] font-bold text-orange-800 leading-relaxed uppercase mb-2">💡 Instruksi Setup Cloud:</p>
                                            <ol className="text-[9px] text-orange-700 space-y-1 ml-4 list-decimal font-medium">
                                                <li>Buka <a href="https://console.firebase.google.com/" target="_blank" className="underline font-black">Firebase Console</a></li>
                                                <li>Pilih proyek: <b>gsm-app-afe20</b></li>
                                                <li>Menu kiri: <b>Build > Firestore Database</b></li>
                                                <li>Klik tombol <b>Create Database</b></li>
                                                <li>Pilih lokasi (Singapore), klik Next</li>
                                                <li>Pilih <b>Start in test mode</b>, klik Create</li>
                                            </ol>
                                        </div>
                                    )}
                                </div>
                                <button onClick={() => { localStorage.clear(); window.location.reload(); }} className="w-full bg-red-50 text-red-500 font-black py-5 rounded-3xl border border-red-100 text-[10px] tracking-widest uppercase active:bg-red-500 active:text-white transition mt-6">RESET DATA LOKAL</button>
                            </div>
                        )}
                    </main>

                    {/* Bottom Nav */}
                    <nav className="fixed bottom-6 left-6 right-6 glass rounded-[2.5rem] border border-white/50 px-6 py-4 flex justify-around items-center bottom-nav-shadow z-40">
                        {[
                            {id: 'Dashboard', icon: '🏠', label: 'Home'},
                            {id: 'Stok', icon: '📦', label: 'Part'},
                            {id: 'Absensi', icon: '📸', label: 'Absen'},
                            {id: 'Pengaturan', icon: '⚙️', label: 'Admin'}
                        ].map(item => (
                            <button 
                                key={item.id}
                                onClick={() => setActiveTab(item.id)} 
                                className={`flex flex-col items-center gap-1.5 transition-all duration-300 ${activeTab === item.id ? 'text-blue-600 scale-110' : 'text-gray-300'}`}
                            >
                                <span className={`text-2xl ${activeTab === item.id ? 'drop-shadow-[0_0_8px_rgba(37,99,235,0.3)]' : ''}`}>{item.icon}</span>
                                <span className={`text-[9px] font-black uppercase tracking-[0.15em] ${activeTab === item.id ? 'opacity-100' : 'opacity-40'}`}>{item.label}</span>
                            </button>
                        ))}
                    </nav>

                    {/* Modal Nota Baru */}
                    {isFormOpen && (
                        <div className="fixed inset-0 bg-[#0f172a]/90 backdrop-blur-md z-[100] flex items-end sm:items-center justify-center p-0 sm:p-4">
                            <form onSubmit={submitNota} className="bg-white w-full max-w-sm rounded-t-[3.5rem] sm:rounded-[3.5rem] p-10 space-y-4 animate-slide-up shadow-2xl overflow-y-auto max-h-[92vh]">
                                <div className="w-16 h-1.5 bg-gray-100 rounded-full mx-auto mb-6 sm:hidden"></div>
                                <div className="text-center mb-6">
                                    <h3 className="font-black text-2xl tracking-tighter uppercase leading-none">NOTA BARU</h3>
                                    <p className="text-[10px] font-bold text-gray-400 mt-2 uppercase tracking-[0.2em]">SGM PROFESSIONAL SYSTEM</p>
                                </div>
                                <div className="space-y-3">
                                    <input type="text" placeholder="Nama Pelanggan" className="w-full bg-gray-50 border-none p-5 rounded-3xl font-bold focus:ring-2 focus:ring-blue-500 transition-all shadow-inner" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} required />
                                    <input type="tel" placeholder="WA (62...)" className="w-full bg-gray-50 border-none p-5 rounded-3xl font-bold focus:ring-2 focus:ring-blue-500 transition-all shadow-inner" value={formData.phone} onChange={e => setFormData({...formData, phone: e.target.value})} required />
                                    <input type="text" placeholder="Tipe HP / Seri" className="w-full bg-gray-50 border-none p-5 rounded-3xl font-bold focus:ring-2 focus:ring-blue-500 transition-all shadow-inner" value={formData.hp} onChange={e => setFormData({...formData, hp: e.target.value})} required />
                                    <input type="number" placeholder="Harga" className="w-full bg-gray-50 border-none p-5 rounded-3xl font-black text-blue-600 shadow-inner" value={formData.harga} onChange={e => setFormData({...formData, harga: e.target.value})} required />
                                    <textarea placeholder="Keluhan" className="w-full bg-gray-50 border-none p-5 rounded-3xl font-bold h-24 focus:ring-2 focus:ring-blue-500 transition-all shadow-inner resize-none" value={formData.keluhan} onChange={e => setFormData({...formData, keluhan: e.target.value})} required></textarea>
                                </div>
                                <div className="pt-4 space-y-3">
                                    <button type="submit" className="w-full bg-blue-600 text-white font-black py-5 rounded-[2rem] shadow-2xl shadow-blue-600/30 active:scale-95 transition">SIMPAN</button>
                                    <button type="button" onClick={() => setIsFormOpen(false)} className="w-full text-[10px] font-bold text-gray-300 uppercase py-2 tracking-widest">Tutup</button>
                                </div>
                            </form>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
