<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGM App - KonterPro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel untuk JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .animate-slide-up { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @media print { .no-print-area { display: none !important; } }
    </style>
</head>
<body class="bg-gray-100">
    <div id="root"></div>

    <script type="module" babel>
        // --- IMPORT FIREBASE DARI CDN ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc, query, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- FIREBASE CONFIG MILIK KAMU ---
        const firebaseConfig = {
            apiKey: "AIzaSyAnaxWWQRgCJ2BT2LY8quibHBPzgoUS1kE",
            authDomain: "gsm-app-afe20.firebaseapp.com",
            projectId: "gsm-app-afe20",
            storageBucket: "gsm-app-afe20.firebasestorage.app",
            messagingSenderId: "721664568589",
            appId: "1:721664568589:web:508d22c640dcea38135444"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "SGM-PRO-KONTER-01";

        const { useState, useEffect, useRef } = React;

        const statusColor = {
            "Masuk": "bg-gray-200 text-gray-700",
            "Bongkar": "bg-yellow-100 text-yellow-700",
            "Menunggu Sparepart": "bg-orange-100 text-orange-700",
            "Proses": "bg-blue-100 text-blue-700",
            "Selesai": "bg-green-100 text-green-700",
            "Sudah Diambil": "bg-teal-100 text-teal-700",
        };

        const SgmLogo = ({ className = "" }) => (
            <svg viewBox="0 0 140 40" className={className} fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="sgmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stopColor="#0284c7" /><stop offset="50%" stopColor="#0ea5e9" /><stop offset="100%" stopColor="#22d3ee" />
                    </linearGradient>
                </defs>
                <circle cx="20" cy="20" r="16" stroke="url(#sgmGrad)" strokeWidth="3" fill="none" />
                <text x="45" y="30" fontFamily="Arial" fontWeight="900" fontSize="32" fill="url(#sgmGrad)" fontStyle="italic">SGM</text>
            </svg>
        );

        function App() {
            const [user, setUser] = useState(null);
            const [loadingDb, setLoadingDb] = useState(true);
            const [role, setRole] = useState(null);
            const [currentUser, setCurrentUser] = useState(null);
            const [loginInput, setLoginInput] = useState({ id: "", pin: "" });
            const [showLoginModal, setShowLoginModal] = useState(false);
            const [activeTab, setActiveTab] = useState("Dashboard");
            const [services, setServices] = useState([]);
            const [stokList, setStokList] = useState([]);
            const [teknisiList, setTeknisiList] = useState([]);
            const [promoList, setPromoList] = useState([]);
            const [konterProfile, setKonterProfile] = useState({ nama: "Toko Gadget", waOwner: "", activeUntil: Date.now() + 2592000000 });
            const [isFormOpen, setIsFormOpen] = useState(false);
            const [formData, setFormData] = useState({ name: "", phone: "", hp: "", keluhan: "", teknisi: "", status: "Masuk", harga: "" });
            const [stats, setStats] = useState({ omzetHarian: 0, aktif: 0, selesai: 0 });

            useEffect(() => {
                signInAnonymously(auth);
                onAuthStateChanged(auth, setUser);
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsub = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'services'), (snap) => {
                    setServices(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                    setLoadingDb(false);
                });
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'stok'), (snap) => setStokList(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'teknisi'), (snap) => setTeknisiList(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'konter_profile'), (snap) => snap.exists() && setKonterProfile(snap.data()));
                return () => unsub();
            }, [user]);

            useEffect(() => {
                const harian = services.filter(s => s.status === "Sudah Diambil").reduce((a, b) => a + (Number(b.harga) || 0), 0);
                const aktif = services.filter(s => s.status !== "Sudah Diambil" && s.status !== "Selesai").length;
                const siap = services.filter(s => s.status === "Selesai").length;
                setStats({ omzetHarian: harian, aktif, selesai: siap });
            }, [services]);

            const formatRp = (n) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(n || 0);

            const handleAddService = async (e) => {
                e.preventDefault();
                const id = `INV-${Math.floor(1000 + Math.random() * 9000)}`;
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'services', id), { ...formData, harga: Number(formData.harga), tglMasuk: new Date().toLocaleDateString() });
                setIsFormOpen(false);
            };

            const handleStatus = async (s, val) => {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'services', s.id), { ...s, status: val, tglDiambilTimestamp: val === "Sudah Diambil" ? Date.now() : null });
            };

            if (loadingDb) return <div className="h-screen flex items-center justify-center font-bold text-blue-600">SGM App Loading...</div>;

            if (!role) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6">
                        <div className="bg-white p-8 rounded-3xl shadow-xl w-full max-w-sm text-center">
                            <SgmLogo className="h-12 mx-auto mb-6" />
                            <h1 className="text-xl font-bold mb-8">{konterProfile.nama}</h1>
                            <div className="flex flex-col gap-3">
                                <button onClick={() => setRole("pelanggan")} className="bg-blue-600 text-white font-bold py-4 rounded-xl">Portal Pelanggan</button>
                                <button onClick={() => { setLoginTargetRole("admin"); setShowLoginModal(true); }} className="bg-gray-800 text-white py-3 rounded-xl text-sm">Masuk Admin</button>
                                <div className="grid grid-cols-2 gap-2">
                                    {teknisiList.map(t => <button key={t.id} onClick={() => { setLoginInput({id: t.nama, pin: ""}); setLoginTargetRole("teknisi"); setShowLoginModal(true); }} className="bg-gray-100 py-2 rounded-xl text-xs font-bold">{t.nama}</button>)}
                                </div>
                            </div>
                        </div>
                        {showLoginModal && (
                            <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
                                <div className="bg-white p-6 rounded-2xl w-full max-w-xs">
                                    <h3 className="font-bold mb-4">PIN {loginTargetRole}</h3>
                                    <input type="password" placeholder="PIN" className="w-full border-2 p-3 rounded-xl text-center mb-4 text-xl" value={loginInput.pin} onChange={e => setLoginInput({...loginInput, pin: e.target.value})} autoFocus />
                                    <button onClick={() => { if(loginInput.pin === "1234" || loginInput.pin === "konter123") { setRole(loginTargetRole); setCurrentUser(loginInput.id || "Admin"); setShowLoginModal(false); } else { alert("Salah!"); } }} className="w-full bg-blue-600 text-white py-3 rounded-xl font-bold">Masuk</button>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            return (
                <div className="pb-20">
                    <header className="bg-blue-700 p-4 text-white flex justify-between items-center shadow-md">
                        <div className="font-bold">{konterProfile.nama}</div>
                        <div className="flex gap-2">
                            <button onClick={() => setIsFormOpen(true)} className="bg-white text-blue-700 px-3 py-1 rounded-lg text-xs font-bold">+ Nota</button>
                            <button onClick={() => setRole(null)} className="bg-red-500 px-3 py-1 rounded-lg text-xs font-bold">Keluar</button>
                        </div>
                    </header>

                    <div className="p-4 space-y-4 max-w-md mx-auto">
                        <div className="bg-gradient-to-br from-blue-600 to-indigo-800 p-6 rounded-3xl text-white shadow-lg">
                            <div className="text-xs opacity-70">KAS SHIFT INI</div>
                            <div className="text-3xl font-black">{formatRp(stats.omzetHarian)}</div>
                        </div>

                        <div className="grid grid-cols-2 gap-3">
                            <div className="bg-white p-4 rounded-2xl border text-center">
                                <div className="text-[10px] text-gray-400 font-bold uppercase">Antrean</div>
                                <div className="text-2xl font-black">{stats.aktif}</div>
                            </div>
                            <div className="bg-white p-4 rounded-2xl border text-center">
                                <div className="text-[10px] text-gray-400 font-bold uppercase">Siap Ambil</div>
                                <div className="text-2xl font-black">{stats.selesai}</div>
                            </div>
                        </div>

                        <div className="space-y-3">
                            <h3 className="font-bold text-gray-700">Daftar Servis Aktif</h3>
                            {services.filter(s => s.status !== "Sudah Diambil").map(s => (
                                <div key={s.id} className="bg-white p-4 rounded-2xl border shadow-sm space-y-2">
                                    <div className="flex justify-between items-start">
                                        <div><div className="font-bold">{s.hp}</div><div className="text-[10px] text-gray-400">{s.id} | {s.name}</div></div>
                                        <div className={`text-[10px] px-2 py-1 rounded-full font-bold ${statusColor[s.status]}`}>{s.status}</div>
                                    </div>
                                    <div className="flex justify-between items-center">
                                        <div className="text-blue-600 font-black">{formatRp(s.harga)}</div>
                                        <select value={s.status} onChange={e => handleStatus(s, e.target.value)} className="text-[10px] border p-1 rounded-lg">
                                            <option value="Masuk">Masuk</option><option value="Proses">Proses</option><option value="Selesai">Selesai</option><option value="Sudah Diambil">Diambil</option>
                                        </select>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    {isFormOpen && (
                        <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
                            <form onSubmit={handleAddService} className="bg-white p-6 rounded-3xl w-full max-w-sm space-y-3 animate-slide-up">
                                <h3 className="font-bold">Nota Baru</h3>
                                <input type="text" placeholder="Nama Pelanggan" className="w-full border p-2 rounded-lg" onChange={e => setFormData({...formData, name: e.target.value})} required />
                                <input type="text" placeholder="Tipe HP" className="w-full border p-2 rounded-lg" onChange={e => setFormData({...formData, hp: e.target.value})} required />
                                <input type="number" placeholder="Biaya" className="w-full border p-2 rounded-lg" onChange={e => setFormData({...formData, harga: e.target.value})} required />
                                <button className="w-full bg-blue-600 text-white font-bold py-3 rounded-xl">Simpan</button>
                                <button type="button" onClick={() => setIsFormOpen(false)} className="w-full text-xs text-gray-400">Batal</button>
                            </form>
                        </div>
                    )}

                    <footer className="fixed bottom-0 left-0 right-0 p-4 bg-white border-t flex flex-col items-center">
                        <span className="text-[8px] font-bold text-gray-300 uppercase tracking-widest mb-1">Licensed to SGM Group</span>
                        <SgmLogo className="h-4 opacity-30" />
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
