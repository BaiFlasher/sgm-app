<body class="bg-[#f8fafc] text-slate-900">
    <div id="root"></div>

    <!-- Gunakan text/babel agar terbaca sempurna oleh library Babel -->
    <script type="text/babel">
        const { useState, useEffect } = React;

        // Konfigurasi Firebase Langsung
        const firebaseConfig = {
            apiKey: "AIzaSyAnaxWWQRgCJ2BT2LY8quibHBPzgoUS1kE",
            authDomain: "gsm-app-afe20.firebaseapp.com",
            projectId: "gsm-app-afe20",
            storageBucket: "gsm-app-afe20.firebasestorage.app",
            messagingSenderId: "721664568589",
            appId: "1:721664568589:web:508d22c640dcea38135444"

        // Karena kita menggunakan script biasa, kita panggil via window.firebase
        // Tapi untuk kemudahan "awam", kita simpan data secara LOKAL dulu agar aplikasi PASTI JALAN
        // Nanti kalau sudah lancar, kita hubungkan ulang ke Cloud.

        function App() {
            const [role, setRole] = useState(null);
            const [services, setServices] = useState(() => {
                const saved = localStorage.getItem("sgm_data");
                return saved ? JSON.parse(saved) : [];
            });
            const [showPin, setShowPin] = useState(false);
            const [pinInput, setPinInput] = useState("");
            const [isFormOpen, setIsFormOpen] = useState(false);
            const [formData, setFormData] = useState({ name: "", hp: "", harga: "", keluhan: "" });

            // Simpan otomatis ke memori HP/Laptop
            useEffect(() => {
                localStorage.setItem("sgm_data", JSON.stringify(services));
            }, [services]);

            const handleLogin = () => {
                if (pinInput === "1234" || pinInput === "konter123") {
                    setRole("admin");
                    setShowPin(false);
                } else {
                    alert("PIN Salah! Coba 1234 atau konter123");
                }
            };

            const addService = (e) => {
                e.preventDefault();
                const newService = {
                    id: 'SGM-' + Math.floor(1000 + Math.random() * 9000),
                    ...formData,
                    status: "Masuk",
                    tanggal: new Date().toLocaleDateString('id-ID')
                };
                setServices([newService, ...services]);
                setIsFormOpen(false);
                setFormData({ name: "", hp: "", harga: "", keluhan: "" });
            };

            const updateStatus = (id, newStatus) => {
                setServices(services.map(s => s.id === id ? { ...s, status: newStatus } : s));
            };

            const formatRp = (n) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(n || 0);

            if (!role) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-6 bg-gradient-to-br from-slate-900 via-blue-900 to-black">
                        <div className="w-full max-w-sm text-center">
                            <div className="mb-8 animate-float">
                                <div className="w-20 h-20 bg-white rounded-[2rem] flex items-center justify-center mx-auto shadow-2xl">
                                    <span className="text-4xl">📱</span>
                                </div>

                            <div className="space-y-4">

                                    <button onClick={handleLogin} className="w-full bg-slate-900 text-white py-4 rounded-2xl font-black shadow-xl">MASUK</button>
                                    <button onClick={() => setShowPin(false)} className="mt-6 text-[10px] font-black text-slate-400 uppercase tracking-widest">Kembali</button>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            return (
                <div className="min-h-screen pb-24">
                    <header className="bg-white border-b border-slate-100 px-6 py-5 flex justify-between items-center sticky top-0 z-40">
                        <div>
                            <div className="font-black text-blue-600 text-xl tracking-tighter">SGM PRO</div>
                            <div className="text-[8px] font-bold text-slate-400 tracking-widest uppercase">Admin Panel</div>
                        </div>
                        <button onClick={() => setRole(null)} className="bg-slate-50 text-slate-400 p-2 rounded-xl border border-slate-100 text-[10px] font-black uppercase">Keluar</button>
                    </header>

                    <main className="p-6 max-w-xl mx-auto w-full space-y-6">
                        <button onClick={() => setIsFormOpen(true)} className="w-full bg-blue-600 text-white p-5 rounded-3xl font-black shadow-xl shadow-blue-600/30 flex items-center justify-center gap-3 active:scale-95 transition-transform">
                            <span className="text-xl">+</span> BUAT NOTA BARU
                        </button>

                        <div className="grid grid-cols-2 gap-4">
                            <div className="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100">
                                <div className="text-[10px] font-black text-slate-400 uppercase mb-2">Total Unit</div>
                                <div className="text-3xl font-black text-slate-800 tracking-tighter">{services.length}</div>
                            </div>
                            <div className="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100">
                                <div className="text-[10px] font-black text-slate-400 uppercase mb-2">Siap Ambil</div>
                                <div className="text-3xl font-black text-green-500 tracking-tighter">{services.filter(s => s.status === 'Selesai').length}</div>
                            </div>
                        </div>

                        <div className="space-y-4">
                            <h3 className="font-black text-slate-800 text-lg flex items-center gap-2">📱 UNIT MASUK</h3>
                            {services.length === 0 && <div className="text-center py-16 text-slate-300 border-2 border-dashed border-slate-100 rounded-[2.5rem] font-bold italic">Belum ada data...</div>}
                            {services.map(s => (
                                <div key={s.id} className="bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-50 flex flex-col gap-4">
                                    <div className="flex justify-between items-start">
                                        <div>
                                            <div className="font-black text-slate-800 text-xl tracking-tight">{s.hp}</div>
                                            <div className="text-[10px] font-bold text-blue-500 uppercase tracking-widest">{s.id} • {s.name}</div>
                                        </div>
                                        <div className={`text-[9px] px-3 py-1.5 rounded-full font-black uppercase tracking-wider ${s.status === 'Selesai' ? 'bg-green-100 text-green-600' : 'bg-blue-50 text-blue-600'}`}>{s.status}</div>
                                    </div>
                                    <div className="flex justify-between items-center bg-slate-50 p-4 rounded-2xl">
                                        <div className="text-slate-900 font-black text-lg">{formatRp(s.harga)}</div>
                                        <select value={s.status} onChange={(e) => updateStatus(s.id, e.target.value)} className="bg-white border-none text-[10px] font-black px-3 py-2 rounded-xl shadow-sm outline-none">
                                            <option value="Masuk">MASUK</option>
                                            <option value="Proses">PROSES</option>
                                            <option value="Selesai">SELESAI</option>
                                            <option value="Sudah Diambil">DIAMBIL</option>
                                        </select>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </main>

                    {isFormOpen && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-6 z-50 backdrop-blur-md">
                            <form onSubmit={addService} className="bg-white p-8 rounded-[3rem] w-full max-w-sm space-y-4 shadow-2xl animate-slide-up">
                                <h3 className="font-black text-2xl mb-4 tracking-tighter">NOTA BARU</h3>
                                <input type="text" placeholder="Nama Pelanggan" className="w-full bg-slate-50 border-none p-4 rounded-2xl font-bold" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} required />
                                <input type="text" placeholder="Tipe HP" className="w-full bg-slate-50 border-none p-4 rounded-2xl font-bold" value={formData.hp} onChange={e => setFormData({...formData, hp: e.target.value})} required />
                                <input type="number" placeholder="Biaya (Rp)" className="w-full bg-slate-50 border-none p-4 rounded-2xl font-black text-blue-600" value={formData.harga} onChange={e => setFormData({...formData, harga: e.target.value})} required />

                                <button className="w-full bg-blue-600 text-white font-black py-5 rounded-[2rem] shadow-xl">SIMPAN DATA</button>
                                <button type="button" onClick={() => setIsFormOpen(false)} className="w-full py-2 text-[10px] font-black text-slate-300 uppercase tracking-widest">Batal</button>
                            </form>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
